# Test and lint every module of the repo, and verify modules by multimod.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
        # Stress and long-running tests run locally. CI exercises
        # cross-platform behavior with the short paths of those tests.
        - os: ubuntu-latest
          gotest_flags: '-short'
        - os: macos-latest
          gotest_flags: '-short'
        - os: windows-latest
          gotest_flags: '-short'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache-dependency-path: '**/go.sum'
    # Windows runners have MSYS2 installed, but neither make nor MSYS2 in PATH.
    # make of MSYS2 runs recipes by /bin/bash of MSYS2, as SHELL of the Makefile.
    - name: Install make
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed make
        "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Test
      # Modules are independent. Two-way parallelism roughly halves local
      # uncached short-suite time without overwhelming smaller hosted runners.
      run: make -j2 test GOTEST_FLAGS="${{ matrix.gotest_flags }}"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache-dependency-path: '**/go.sum'
    - name: Lint
      run: make lint

  # Verify generated files are up to date with their generators of this repo.
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # protoc version in headers of generated .pb.go files.
      PROTOC_VERSION: '32.0'
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache-dependency-path: '**/go.sum'
    # The release includes protos of google/protobuf beside bin/protoc, found by gen.sh of protoc-gen-go-tag.
    - name: Install protoc
      run: |
        curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
          "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
        unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
        echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
    - name: Generate
      run: make generate
    - name: Verify generated files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          git status --short
          git diff
          echo "generated files are out of date, run 'make generate' and commit them" >&2
          exit 1
        fi

  # Verify versions.yaml lists every module, and the root module requires every module of module sets.
  verify-mods:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache-dependency-path: |
          go.sum
          internal/tools/go.sum
    - name: Verify modules
      run: make verify-mods

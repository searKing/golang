# Test and lint every module of the repo, and verify modules by multimod.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache-dependency-path: '**/go.sum'
    # Windows runners have MSYS2 installed, but neither make nor MSYS2 in PATH.
    # make of MSYS2 runs recipes by /bin/bash of MSYS2, as SHELL of the Makefile.
    - name: Install make
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed make
        "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Test
      run: make test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache-dependency-path: '**/go.sum'
    - name: Lint
      run: make lint

  # Verify versions.yaml lists every module, and the root module requires every module of module sets.
  verify-mods:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache-dependency-path: |
          go.sum
          internal/tools/go.sum
    - name: Verify modules
      run: make verify-mods

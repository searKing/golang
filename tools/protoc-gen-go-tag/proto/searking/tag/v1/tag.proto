syntax = "proto3";

package searking.tag.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/searKing/golang/tools/protoc-gen-go-tag/proto/searking/tag/v1;tagv1";

extend google.protobuf.FieldOptions {
  // field_tag sets struct tags of the field in Go code generated by protoc-gen-go-tag.
  //
  // 1391 is registered in the Protobuf Global Extension Registry:
  // https://github.com/protocolbuffers/protobuf/blob/main/docs/options.md
  FieldTag field_tag = 1391;
}

// FieldTag is struct tags of a field.
//
// FieldTag is wire compatible with google.protobuf.FieldTag of the deprecated
// github.com/searKing/golang/tools/protoc-gen-go-tag/tag/tag.proto.
message FieldTag {
  // UpdateStrategy is how struct_tag is applied to struct tags generated by protoc-gen-go.
  enum UpdateStrategy {
    // UPDATE_STRATEGY_UPDATE replaces names, and adds options of struct tags generated by protoc-gen-go.
    // It is the zero value, as update of google.protobuf.FieldTag.UpdateStrategy is.
    // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
    UPDATE_STRATEGY_UPDATE = 0;
    // UPDATE_STRATEGY_REPLACE replaces struct tags generated by protoc-gen-go.
    UPDATE_STRATEGY_REPLACE = 1;
  }

  // struct_tag is struct tags in the syntax of Go, such as `validate:"required" json:"name"`.
  string struct_tag = 1;
  // update_strategy is how struct_tag is applied, UPDATE_STRATEGY_UPDATE by default.
  UpdateStrategy update_strategy = 2;
}

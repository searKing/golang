syntax = "proto3";

package comment;

option go_package = "github.com/searKing/golang/tools/protoc-gen-go-tag/testdata/proto/comment;comment";

// Comment sets struct tags by comments, without importing tag.proto.
message Comment {
  // name is required.
  // @gotags: validate:"required" json:"name_tag"
  string name = 1;
  string email = 2; // @gotags: validate:"email"
  // @gotags-replace: json:"age"
  int32 age = 3;
  // @gotags: validate:"max=10"
  // @gotags: form:"tags"
  repeated string tags = 4;

  oneof choice {
    // @gotags: validate:"url"
    string url = 5;
  }
}

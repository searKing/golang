syntax = "proto3";

package edge;

import "google/protobuf/descriptor.proto";
import "searking/tag/v1/tag.proto";

option go_package = "github.com/searKing/golang/tools/protoc-gen-go-tag/testdata/proto/edge;edge";

extend google.protobuf.OneofOptions {
  string oneof_note = 50000;
}

// Edge has fields renamed by protogen, a proto3 optional field and a oneof with options.
message Edge {
  // reset is generated as Reset_, for Reset is a method of messages.
  string reset = 1 [(searking.tag.v1.field_tag) = {struct_tag: 'validate:"required"'}];
  // descriptor is generated as Descriptor_, for Descriptor is a method of messages.
  string descriptor = 2 [(searking.tag.v1.field_tag) = {struct_tag: 'json:"desc"', update_strategy: UPDATE_STRATEGY_REPLACE}];
  // optional is a field of a synthetic oneof, which is generated in the struct of the message.
  optional string optional = 3 [(searking.tag.v1.field_tag) = {struct_tag: 'validate:"omitempty"'}];
  // both is tagged by field_tag, then by comments.
  // @gotags: form:"both"
  string both = 6 [(searking.tag.v1.field_tag) = {struct_tag: 'json:"both_tag"', update_strategy: UPDATE_STRATEGY_REPLACE}]; // @gotags: json:",omitempty"

  oneof choice {
    option (oneof_note) = "oneof with options";
    string name = 4 [(searking.tag.v1.field_tag) = {struct_tag: 'validate:"required"'}];
    Nested nested = 5 [(searking.tag.v1.field_tag) = {struct_tag: 'json:"nested_tag"'}];
  }

  message Nested {
    string value = 1 [(searking.tag.v1.field_tag) = {struct_tag: 'validate:"max=10"'}];
  }
}
